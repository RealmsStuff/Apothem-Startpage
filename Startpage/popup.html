<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Recreating your CSS variables based on the Rosé Pine theme */
    :root {
      --bg-color: #1f1d2e;     /* Dark background */
      --color-iris: #c4a7e7;   /* Purple title color */
      --text-subtle: #908caa;  /* Grayish subtitle text */
    }

    body {
      width: 280px;            /* Perfect width for a small info popup */
      margin: 0;
      padding: 25px 15px;
      background-color: var(--bg-color);
      font-family: 'Nunito', sans-serif;
      text-align: center;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: var(--color-iris);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .description {
      color: var(--text-subtle);
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 1.2rem;
    }

    .version {
      color: var(--text-subtle);
      font-size: 0.8rem;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  
  <h3>Apothem Startpage</h3>
  <p class="description">A custom, lightweight browser start page.</p>
  <p class="version">
    Version 1.0.5 <br>
    Designed for Vivaldi & modern browsers.
  </p>

</body>
</html>
